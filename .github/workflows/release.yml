name: release
on:
  push:
    tags:
      - 'lazyssh-????-??-??'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^lazyssh-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Release tag must use lazyssh-YYYY-MM-DD, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          release_date="${GITHUB_REF_NAME#lazyssh-}"
          date -d "${release_date}" "+%Y-%m-%d" >/dev/null
          echo "RELEASE_DATE=${release_date}" >> "$GITHUB_ENV"
      - name: Check existing release
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${GITHUB_REF_NAME} already exists, skipping GoReleaser."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run GoReleaser
        if: steps.release_check.outputs.exists != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
