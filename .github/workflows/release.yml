name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]{4})\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])$ ]]; then
            echo "Release tag must use vYYYY.M.D without leading zeroes, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          release_version="${GITHUB_REF_NAME#v}"
          release_date="$(printf "%04d-%02d-%02d" "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")"
          normalized_version="$(date -d "${release_date}" "+%Y.%-m.%-d")"
          if [[ "${normalized_version}" != "${release_version}" ]]; then
            echo "Release tag date is invalid: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "RELEASE_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Check existing release
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${GITHUB_REF_NAME} already exists, skipping GoReleaser."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run GoReleaser
        if: steps.release_check.outputs.exists != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
